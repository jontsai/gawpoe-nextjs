# Root-owned nginx configuration. Certbot adds HTTPS after DNS is routed here.
server {
    listen 80;
    listen [::]:80;
    server_name gawpoe.dev.upinthe.xyz;

    location / {
        proxy_pass http://127.0.0.1:3186;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}
